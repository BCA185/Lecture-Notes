<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1>Description Lists</h1>
        <p>
            A description list is a list of terms, with a description of each
            term.
        </p>
        <p>
            The &lt;dl&gt; tag defines the description list, the &lt;dt&gt; tag
            defines the term (name), and the &lt;dd&gt; tag describes each term
        </p>
        <!-- TODO change this to a FAQ example -->
        <h2>Example:</h2>
        <dl>
            <dt>Coffee</dt>
            <dd>- black hot drink</dd>
            <dt>Milk</dt>
            <dd>- white cold drink</dd>
        </dl>
    </body>
</html>
