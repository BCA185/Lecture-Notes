<!DOCTYPE html>
<html>
<!--    
	Ray Ryon 4/26/2020
	Photo Galary Example without CSS and JavaScript added   
	-->

<head>
	<title>HTML Photo Gallery Example 1</title>
</head>

<body>
	<h1> Photo Gallery Example 1 (HTML only)</h1>
	<p>This example has HTML only code for a Photo Gallery. You click on the Thumb nail and it shows a larger image.
		Click on the browser back arrow to go back to the gallery.</p>
	<div class="section" id="section">
		<h3>Photo Gallery</h3>
		<div class="imageRow">
			<div class="single">
				<a href="photos/butterfly-fish.jpg">
					<img src="photos/butterfly-fish-thumb.jpg">
				</a>
			</div><!--end single-->
			<div class="single">
				<a href="photos/scr-fish.jpg">
					<img src="photos/scr-fish-thumb.jpg">
				</a>
			</div><!--end single-->
		</div><!--end imageRow-->
	</div><!--end section-->
</body>
