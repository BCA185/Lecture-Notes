<!DOCTYPE html>
<html lang="en-US">
    <head>
        <title>Cookie Lightroom</title>

        <link rel="stylesheet" href="css/styles.css" />
        <link rel="stylesheet" href="css/weeklycookies.css" />
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <a href="cookie.html">
                <img src="images/Logo White.png" />
            </a>

        <nav>
            <ul>
                <li><a href="weeklycookies.html">Weekly Cookies</a></li>

        <h1>Weekly Cookies</h1>
        <!-- Images used to open the lightbox -->
        <div class="grid">
            <img
                src="thumb/bananasplit.png"
                class="hover-shadow"
                alt="Banana Split"
            />
            <img
                src="thumb/bogoCookiewich.png"
                class="hover-shadow"
                alt="Bogo Cookiewich"
            />
            <img
                src="thumb/chocolatemint.png"
                class="hover-shadow"
                alt="Chocolate Mint"
            />
            <img
                src="thumb/hotfudgesundae.png"
                class="hover-shadow"
                alt="Hot Fudge Sunday"
            />
            <img
                src="thumb/oatmealRaisin.png"
                class="hover-shadow"
                alt="Oatmeal Raisin"
            />
            <img
                src="thumb/peanutButterChip.png"
                class="hover-shadow"
                alt="Peanut Butter Chip"
            />
            <img
                src="thumb/rootbeerfloat.png"
                class="hover-shadow"
                alt="Rootbeer Float"
            />
            <img
                src="thumb/whiteChocolateMacadamia.png"
                class="hover-shadow"
                alt="White Chocolate Macaadamia"
            />
        </div>
        <!-- The Modal/Lightbox -->
        <div id="myModal" class="modal">
            <!-- Close icon -->
            <span class="close cursor" ">&times;</span>
            <div class="modal-content">
                <a class="prev">&#10094;</a>
                <div class="mySlides">
                    <div class="numbertext">1 / 8</div>
                    <img src="images/bananasplit.png" alt="Banana Split" />
                </div>

                <div class="mySlides">
                    <div class="numbertext">2 / 8</div>
                    <img
                        src="images/bogoCookiewich.png"
                        alt="Bogo Cookiewich"
                    />
                </div>

                <div class="mySlides">
                    <div class="numbertext">3 / 8</div>
                    <img src="images/chocolatemint.png" alt="Chocolate Mint" />
                </div>
                <div class="mySlides">
                    <div class="numbertext">4 / 8</div>
                    <img
                        src="images/hotfudgesundae.png"
                        alt="Hot Fudge Sunday"
                    />
                </div>
                <div class="mySlides">
                    <div class="numbertext">5 / 8</div>
                    <img src="images/oatmealRaisin.png" alt="Oatmeal Raisin" />
                </div>
                <div class="mySlides">
                    <div class="numbertext">6 / 8</div>
                    <img
                        src="images/peanutButterChip.png"
                        alt="Peanut Butter Chip"
                    />
                </div>
                <div class="mySlides">
                    <div class="numbertext">7 / 8</div>
                    <img src="images/rootbeerfloat.png" alt="Rootbeer Float" />
                </div>
                <div class="mySlides">
                    <div class="numbertext">8 / 8</div>
                    <img
                        src="images/whiteChocolateMacadamia.png"
                        alt="White Chocolate Macaadamia"
                    />
                </div>

                <!-- Next/previous controls -->

                <a class="next">&#10095;</a>

                <!-- Caption text -->
                <div class="caption-container">
                    <p id="caption"></p>
                </div>

                <div class="grid">
                    <!-- Thumbnail image controls -->
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/bananasplit.png"
                            alt="Banana Split"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/bogoCookiewich.png"
                            alt="Bogo Cookiewich"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/chocolatemint.png"
                            alt="Chocolate Mint"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/hotfudgesundae.png"
                            alt="Hot Fudge Sunday"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/oatmealRaisin.png"
                            alt="Oatmeal Raisin"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/peanutButterChip.png"
                            alt="Peanut Butter Chip"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/rootbeerfloat.png"
                            alt="Rootbeer Float"
                        />
                    </div>
                    <div class="thumb-gallary">
                        <img
                            class="demo"
                            src="thumb/whiteChocolateMacadamia.png"
                            alt="White Chocolate Macaadamia"
                        />
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
