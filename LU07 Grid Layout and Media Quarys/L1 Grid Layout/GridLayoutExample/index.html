<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grid Layout Example</title>
        <style>
            .box {
                background-color: blue;
                color: white;
                border: 1px solid #000;
                text-align: center;
                font-size: 2rem;
            }
            .container {
                display: grid;
                gap: 10px;

                /* 3 equal columns */
                grid-template-columns: repeat(3, 1fr);

                /* Two columns: 70% and 30% */
                /* grid-template-columns: 7fr 3fr; */
            }
            #big-box {
                grid-column: span 2;
            }
        </style>
    </head>
    <body>
        <h1>Grid Layout Example</h1>

        <div class="container">
            <div id="big-box" class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
        </div>
    </body>
</html>
