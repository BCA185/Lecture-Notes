<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* Everything in here is CSS */
            h1 {
                color: blue;
            }
            p {
                font-weight: bold;
                font-family:
                    'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS',
                    sans-serif;
            }
            #list {
                list-style: none;
            }
        </style>
    </head>
    <body>
        <h1>This text is blue</h1>
        <p>This is bold and Gill Sans Font</p>
        <!-- ul>li*3 -->
        <ul id="list">
            <li>With CSS</li>
            <li>You can change the look of most elements</li>
            <li>Even built in styling of elements like list</li>
        </ul>
    </body>
</html>
